<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitalisation in Agriculture</title>
    <link rel="stylesheet" href="styles2.css"> 
    <style>
        .box{
            font-size: 50px;
             background: linear-gradient(135deg,#4caf50,#8BC34A);
            border-radius: 12px;
            padding: 40px;
            width: fit-content;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
           
        }
    </style>
</head>
<body>
    <script type="text/javascript" src="//use.typekit.net/dik5xgb.js"></script>
<script type="text/javascript">try{Typekit.load();}catch(e){}</script>
<div class="box">
     
    <marquee behavior="moveable" direction="right" scrollamount="15" loop="40">SMART FARMING</marquee>
    </div></div>
</div>
    <div class="container">
        
        <div class="content">
            <div class="card">
                <a href="calc.html">
                <img src="fertilizer-calculator.webp" alt="clickable image">
                <h2>Fertilizer Calculator</h2></a>
            </div>
            <div class="card">
                <a href="https://soilhealth.dac.gov.in/fertiliser-dosage">
                <img src="soil.jpg" alt="clickable image">
                <h3>Soil Monitoring </h3></a>
            </div>
            <div class="card">
                <a href="https://soilhealth.dac.gov.in/piechart">
                    <img src="Nut.jpeg" alt="clickable image">
                    <h3>Soil Nutriation</h3>
                </a>
            </div>
            
            <div class="card">
                <a href="https://weather.com/en-IN/weather/today/l/28.97,77.74?par=google">
                    <img src="weather.png" alt="clickable image">
                    <h3>Weather Monitoring</h3>
                </a>
            </div>
            <div class="card">
                <a href="https://chatgpt.com">
                    <img src="Chatbot.jpeg" alt="clickable image">
                    <h3>ASK From AI</h3>
                </a>
            </div>
        </div>
    </div>
    <script src="Script2.js"></script>
        
    </div>
</body>
</html>
